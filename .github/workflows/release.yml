name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches CMakeLists.txt version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version="$(grep -oP '^project\(Prism VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)"
          if [ "${tag_version}" != "${cmake_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match CMakeLists.txt's project version (${cmake_version})"
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

      - name: Check the Arch package version matches too
        shell: bash
        run: |
          pkgver="$(grep -oP '^pkgver=\K.*' packaging/arch/PKGBUILD)"
          if [ "${pkgver}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::packaging/arch/PKGBUILD pkgver=${pkgver} does not match ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check release notes exist for this version
        run: python3 scripts/extract_release_notes.py "${{ steps.version.outputs.version }}" release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  package:
    name: Package
    permissions:
      contents: write
      actions: write
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    secrets: inherit

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [verify, package]
    # Secrets cannot appear in a step's `if:`, so they are mapped into the job environment and the
    # optional steps test the mapped variable instead.
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release notes
        run: |
          cp dist/release-notes/release-notes.md notes.md
          cat >> notes.md <<'EOF'

          ## Installing

          - **AppImage** (Linux, any distro): `chmod +x Prism-*-x86_64.AppImage && ./Prism-*-x86_64.AppImage`
          - **Windows installer**: run `Prism-Setup-*-x64.exe`
          - **Windows portable**: extract `Prism-Portable-*-x64.zip` anywhere and run `Prism.exe` from the
            `Prism` folder inside it. Nothing is installed, but settings are still stored per-user.
          - **macOS**: open `Prism-*-arm64.dmg` (Apple Silicon) and drag Prism to Applications. Unless these
            notes say the build is notarised, the first launch needs right-click → Open.
          - **Arch Linux**: `sudo pacman -U prism-*.pkg.tar.zst`
          - **Flatpak**: requires `flatpak` with the Flathub remote added (`flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo`), then `flatpak install --user Prism-*-x86_64.flatpak`
          EOF

      # The in-app updater falls back to this when GitHub's API does not give it an asset digest,
      # and refuses to install a file it has no hash for.
      - name: Write SHA256SUMS
        run: |
          sha256sum \
            dist/linux-appimage/*.AppImage \
            dist/windows-installer/*.exe \
            dist/windows-portable/*.zip \
            dist/macos-dmg/*.dmg \
            dist/arch-package/*.pkg.tar.zst \
            dist/flatpak-bundle-*/*.flatpak \
            | sed -E 's#  .*/#  #' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Prism ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/linux-appimage/*.AppImage \
            dist/linux-appimage/*.AppImage.zsync \
            dist/windows-installer/*.exe \
            dist/windows-portable/*.zip \
            dist/macos-dmg/*.dmg \
            dist/arch-package/*.pkg.tar.zst \
            dist/flatpak-bundle-*/*.flatpak \
            SHA256SUMS

      - name: Update Homebrew Tap
        if: env.TAP_GITHUB_TOKEN != ''
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG=$(ls dist/macos-dmg/Prism-*-arm64.dmg 2>/dev/null | head -n 1)
          if [ -z "$DMG" ]; then
            echo "::warning::Apple Silicon DMG not found in dist/macos-dmg/; skipping Homebrew tap update."
            exit 0
          fi

          SHA256=$(sha256sum "$DMG" | awk '{print $1}')

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/CutWire-Studios/homebrew-tap.git" tap
          cd tap
          if [ ! -f Casks/prism.rb ]; then
            echo "::warning::Casks/prism.rb does not exist in the tap; skipping Homebrew tap update."
            exit 0
          fi

          sed -i.bak -E "s/version \"[0-9.]+\"/version \"${VERSION}\"/" Casks/prism.rb
          sed -i.bak -E "s/sha256 \"[a-f0-9]{64}\"/sha256 \"${SHA256}\"/" Casks/prism.rb
          rm -f Casks/prism.rb.bak

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/prism.rb
          if git diff --staged --quiet; then
            echo "No changes to Casks/prism.rb; tap is already up to date."
          else
            git commit -m "prism ${VERSION}"
            git push origin main
          fi

      # Posts a branded embed card to CutWire Discord #releases. This lives here
      # rather than in a `release: published` workflow because releases created
      # with GITHUB_TOKEN do not trigger further workflow runs.
      - name: Notify Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > release.json
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK_URL"].strip()

          with open("release.json", encoding="utf-8") as f:
              release = json.load(f)

          EMBED_DESC_LIMIT = 4096
          PRISM_VIOLET = 0x7A64E8
          ICON = "https://raw.githubusercontent.com/CutWire-Studios/Prism/main/Prism_icon.png"

          def github_md_to_discord(text: str) -> str:
              lines = []
              for line in text.splitlines():
                  if line.startswith("### "):
                      lines.append(f"**{line[4:].strip()}**")
                  elif line.startswith("## "):
                      lines.append(f"**{line[3:].strip()}**")
                  elif line.startswith("# "):
                      lines.append(f"**{line[2:].strip()}**")
                  else:
                      lines.append(line)
              return "\n".join(lines).strip()

          def clamp(text: str, limit: int) -> str:
              if len(text) <= limit:
                  return text
              cut = text[: limit - 1]
              if "\n" in cut:
                  cut = cut.rsplit("\n", 1)[0]
              return cut.rstrip() + "…"

          def asset_label(name: str) -> str | None:
              n = name.lower()
              if n.endswith(".zsync"):
                  return None
              is_arm = "arm64" in n or "aarch64" in n
              if n.endswith(".appimage"):
                  return "Linux AppImage (x86_64)"
              if n.endswith(".dmg"):
                  return "macOS (Apple Silicon)"
              if "portable" in n and n.endswith(".zip"):
                  return "Windows portable (x64)"
              if "setup" in n and n.endswith(".exe"):
                  return "Windows installer (x64)"
              if n.endswith(".flatpak"):
                  return "Flatpak bundle (aarch64)" if is_arm else "Flatpak bundle (x86_64)"
              if n.endswith(".pkg.tar.zst"):
                  return "Arch Linux (x86_64)"
              return name

          tag = release.get("tag_name") or ""
          title = release.get("name") or f"Prism {tag}"
          url = release["html_url"]
          notes = github_md_to_discord(release.get("body") or "")
          description = clamp(notes or "New Prism release.", EMBED_DESC_LIMIT)

          downloads = ["[All assets](" + url + ")"]
          for asset in release.get("assets") or []:
              label = asset_label(asset.get("name") or "")
              if not label:
                  continue
              downloads.append(f"[{label}]({asset['browser_download_url']})")

          payload = {
              "username": "Prism",
              "avatar_url": ICON,
              "allowed_mentions": {"parse": []},
              "embeds": [
                  {
                      "title": title,
                      "url": url,
                      "description": description,
                      "color": PRISM_VIOLET,
                      "timestamp": release.get("published_at"),
                      "author": {
                          "name": "CutWire Studios",
                          "url": "https://github.com/CutWire-Studios/Prism",
                          "icon_url": ICON,
                      },
                      "thumbnail": {"url": ICON},
                      "fields": [
                          {
                              "name": "Downloads",
                              "value": clamp("\n".join(downloads), 1024),
                          }
                      ],
                      "footer": {"text": f"GitHub · {tag}"},
                  }
              ],
          }

          req = urllib.request.Request(
              webhook.split("?")[0] + "?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "CutWire-Prism-Release-Notify",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  msg = json.load(resp)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Discord webhook failed HTTP {exc.code}: {body}") from exc

          print(f"Posted Discord message {msg.get('id')} in channel {msg.get('channel_id')}")
          PY
