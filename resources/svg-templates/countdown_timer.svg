<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220">
  <metadata id="prism">{"name":"Countdown timer","params":[
    {"name":"label","label":"Label","type":"text","default":"COUNTDOWN"},
    {"name":"target","label":"Target (seconds or ISO date-time)","type":"text","default":"600"},
    {"name":"color","label":"Timer color","type":"color","default":"#ff6f00"},
    {"name":"urgentColor","label":"Last-minute color","type":"color","default":"#f44336"},
    {"name":"labelColor","label":"Label color","type":"color","default":"#90a4ae"},
    {"name":"panelColor","label":"Panel color","type":"color","default":"#0d1117"}
  ]}</metadata>
  <rect width="640" height="220" rx="18" fill="{panelColor}" fill-opacity="0.88"/>
  <rect x="1" y="1" width="638" height="218" rx="17" fill="none" stroke="{countdownColor}" stroke-opacity="0.35" stroke-width="2"/>
  <text x="320" y="62" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="{labelColor}">{label}</text>
  <text x="320" y="164" text-anchor="middle" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="96" font-weight="bold" fill="{countdownColor}">{countdown}</text>
</svg>
