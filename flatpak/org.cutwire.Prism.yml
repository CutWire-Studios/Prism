app-id: org.cutwire.Prism
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
# clang for the Skia build: org.kde.Sdk ships gcc only, and Skia's GN toolchain files are written
# for clang. The extension is build-time only; nothing from it ends up in /app.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: Prism
rename-icon: org.cutwire.Prism

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  # Webcam capture and v4l2 virtual-camera output need raw /dev/video* access,
  # which the camera portal cannot provide; --device=dri covers GPU rendering.
  - --device=all

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/aclocal
  - /share/doc
  - /share/man
  - "*.a"
  - "*.la"

modules:
  - name: re2
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DRE2_BUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://github.com/google/re2/releases/download/2024-07-02/re2-2024-07-02.tar.gz
        sha256: eb2df807c781601c14a260a507a5bb4509be1ee626024cb45acbd57cb9d4032b

  - name: kissfft
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DKISSFFT_DATATYPE=float
      - -DKISSFFT_STATIC=ON
      - -DKISSFFT_TEST=OFF
      - -DKISSFFT_TOOLS=OFF
      - -DKISSFFT_OPENMP=OFF
    sources:
      - type: archive
        url: https://github.com/mborgerding/kissfft/archive/131.1.0.tar.gz
        sha256: 76c1aac87ddb7258f34b08a13f0eebf9e53afa299857568346aa5c82bcafaf1a

  - name: libzip
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DENABLE_BZIP2=OFF
      - -DENABLE_LZMA=OFF
      - -DENABLE_ZSTD=OFF
      - -DENABLE_OPENSSL=OFF
      - -DBUILD_TOOLS=OFF
      - -DBUILD_REGRESS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_DOC=OFF
    sources:
      - type: archive
        url: https://libzip.org/download/libzip-1.11.4.tar.gz
        sha256: 82e9f2f2421f9d7c2466bbc3173cd09595a88ea37db0d559a9d0a2dc60dc722e

  - name: lua
    buildsystem: simple
    build-commands:
      - make posix MYCFLAGS="-fPIC" -j${FLATPAK_BUILDER_N_JOBS}
      - make install INSTALL_TOP=/app
      - install -d /app/lib/pkgconfig
      # Vanilla Lua ships no pkg-config file; Prism looks up `lua5.4`.
      - |
        printf 'prefix=/app\nexec_prefix=${prefix}\nlibdir=${exec_prefix}/lib\nincludedir=${prefix}/include\n\nName: Lua\nDescription: An Extensible Extension Language\nVersion: 5.4.8\nLibs: -L${libdir} -llua -lm -ldl\nCflags: -I${includedir}\n' > /app/lib/pkgconfig/lua5.4.pc
    sources:
      - type: archive
        url: https://www.lua.org/ftp/lua-5.4.8.tar.gz
        sha256: 4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae

  # Pre-built CPU inference build; Prism links against it for the Remove Background
  # process node (MediaPipe selfie-segmentation via ONNX Runtime).
  - name: onnxruntime
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/include ${FLATPAK_DEST}/lib
      - cp -a include/. ${FLATPAK_DEST}/include/
      - cp -a lib/. ${FLATPAK_DEST}/lib/
    sources:
      - type: archive
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-linux-x64-1.27.0.tgz
        sha256: 547e40a48f1fe73e3f812d7c88a948612c23f896b91e4e2ee1e232d7b468246f
        strip-components: 1
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.0/onnxruntime-linux-aarch64-1.27.0.tgz
        sha256: 3e4d83ac06924a32a07b6d7f91ce6f852876153fc0bbdf931bf517a140bfbe48
        strip-components: 1
        only-arches:
          - aarch64

  # Pitch shifting for the audio effects. Not in org.kde.Platform, so it is built here.
  - name: soundtouch
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DSOUNDSTRETCH=OFF
      # Without this it lands in /app/lib64, where neither pkg-config nor the runtime linker looks.
      - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      # Upstream's own release tarball; the mirror is fetched first because www.surina.net
      # times out from CI often enough to fail builds. The sha256 is upstream's either way.
      - type: archive
        url: https://github.com/CutWire-Studios/SoundTouch-Builds/releases/download/2.4.1/soundtouch-2.4.1.tar.gz
        mirror-urls:
          - https://www.surina.net/soundtouch/soundtouch-2.4.1.tar.gz
        sha256: e07abf20ce8f95850c280132e1f61ad400fc1f4011b7fac698a503de6aab6733

  # Skia's build generator. Not in the SDK and has no release tarballs, so it is built from source
  # with the SDK's gcc. --allow-warnings: gn builds with -Werror and trips over gcc's newer
  # warnings; the commit-position header is hand-written because there is no git metadata to
  # derive it from inside the sandbox.
  - name: gn
    buildsystem: simple
    build-commands:
      - CC=gcc CXX=g++ python3 build/gen.py --no-last-commit-position --allow-warnings --out-path=out
      - printf '#ifndef OUT_LAST_COMMIT_POSITION_H_\n#define OUT_LAST_COMMIT_POSITION_H_\n#define LAST_COMMIT_POSITION_NUM 0\n#define LAST_COMMIT_POSITION "0 (prism)"\n#endif\n' > out/last_commit_position.h
      - ninja -C out -j${FLATPAK_BUILDER_N_JOBS} gn
      - install -Dm755 out/gn ${FLATPAK_DEST}/bin/gn
    sources:
      - type: git
        url: https://gn.googlesource.com/gn
        commit: 0625da07ece7b1a374ec0719b6f40ebe3d0950c1

  # buildsystem: simple rather than cmake-ninja because Skia has to be compiled first, from the
  # script inside this very source tree (third_party/build-skia.sh), against the Skia tarball
  # declared below — flatpak-builder has no hook for a pre-configure step.
  - name: Prism
    buildsystem: simple
    build-options:
      prepend-pkg-config-path: /app/lib/pkgconfig
      append-path: /usr/lib/sdk/llvm20/bin
    build-commands:
      - case "$FLATPAK_ARCH" in x86_64) t=linux-x64 ;; aarch64) t=linux-arm64 ;; *) echo "no Skia target for $FLATPAK_ARCH" >&2; exit 1 ;; esac;
        CC=clang CXX=clang++ JOBS=${FLATPAK_BUILDER_N_JOBS} third_party/build-skia.sh "$t"
      - cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_INSTALL_LIBDIR=lib
        -DCMAKE_BUILD_TYPE=Release
        -DPRISM_WITH_NDI=OFF
        -DPRISM_WITH_LUA=ON
        -DPRISM_WITH_WEBRTC=ON
        -DPRISM_WITH_SEGMENTATION=ON
        -DONNXRUNTIME_ROOT=/app
        -DPRISM_FETCH_JUCE=OFF
        -DPRISM_JUCE_DIR=juce
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        -DFETCHCONTENT_FULLY_DISCONNECTED=ON
        -DFETCHCONTENT_SOURCE_DIR_SOL2=/run/build/Prism/vendor/sol2
        -DFETCHCONTENT_SOURCE_DIR_LIBDATACHANNEL=/run/build/Prism/vendor/libdatachannel
      - cmake --build build -j${FLATPAK_BUILDER_N_JOBS}
      - cmake --install build
    # sol2 and libdatachannel are still consumed via CMake FetchContent, but their sources are
    # vendored below and pointed at with FETCHCONTENT_SOURCE_DIR so the build never touches the
    # network. FULLY_DISCONNECTED enforces that. Skia is found in-tree under
    # third_party/prebuilt/skia/<target>, where build-skia.sh installs it.
    sources:
      - type: dir
        path: ..
        skip:
          - flatpak/.flatpak-builder
          - flatpak/build-dir
          - flatpak/repo
          - build
          - juce
          # Local Skia checkouts and prebuilts (gitignored); the sandbox builds its own.
          - third_party/src
          - third_party/prebuilt

      # JUCE (audio effect DSP; only juce_dsp and its dependencies are compiled). Unpacked into the
      # tree rather than fetched by CMake: the build has no network. Keep the version in step with
      # PRISM_JUCE_TAG in CMakeLists.txt.
      - type: archive
        url: https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.15.tar.gz
        sha256: 0eafd736286c6e7bb6958d79fce18d42cb654b8e231890d327b7cece379bd156
        dest: juce

      # Skia at the commit third_party/build-skia.sh pins, unpacked where the script looks for it so
      # it never reaches for the network. Keep url, sha256 and dest in step with the script.
      - type: archive
        url: https://github.com/google/skia/archive/e7c90ecca9444fe09598f1630ab7cee2c0ee027a.tar.gz
        sha256: 7b5158952ebc4e2ce8de19f036b7613e266705003469579d9e98070ead62fc3b
        dest: third_party/src/skia-e7c90ecca9444fe09598f1630ab7cee2c0ee027a

      # Header-only Lua binding, matches the FetchContent tag in CMakeLists.txt.
      - type: archive
        url: https://github.com/ThePhD/sol2/archive/refs/tags/v3.5.0.tar.gz
        sha256: 86c0f6d2836b184a250fc2907091c076bf53c9603dd291eaebade36cc342e13c
        dest: vendor/sol2

      # libdatachannel v0.24.5 plus its git submodules (it add_subdirectory()s
      # deps/* at configure time), pinned to the exact commits it references.
      - type: archive
        url: https://github.com/paullouisageneau/libdatachannel/archive/refs/tags/v0.24.5.tar.gz
        sha256: 454537c3cd526bed935d847bb2dff4046f266eef84d43b2a5f2f2f293c0026f4
        dest: vendor/libdatachannel
      - type: archive
        url: https://github.com/SergiusTheBest/plog/archive/94899e0b926ac1b0f4750bfbd495167b4a6ae9ef.tar.gz
        sha256: 92a08bce559b5f28aa88d3fd9071567414b9f43a83fe2a05a6dd14f1da536072
        dest: vendor/libdatachannel/deps/plog
      - type: archive
        url: https://github.com/paullouisageneau/usrsctp/archive/fec583d54493f879d2ae44a743423bf8a04371ab.tar.gz
        sha256: e5c114afe73c9a0ec419fab5f5b3f63f3ce57b09b90d06ea85e63dca8aed3e7c
        dest: vendor/libdatachannel/deps/usrsctp
      - type: archive
        url: https://github.com/cisco/libsrtp/archive/24b3bf8f19b6f5ab4cd2bcceb4f4064efca86fd5.tar.gz
        sha256: 063478e368d7cd13d04a908d152a46f90bfa728c4b324be6d413b0b92728207c
        dest: vendor/libdatachannel/deps/libsrtp
      - type: archive
        url: https://github.com/paullouisageneau/libjuice/archive/3c40a3545b6b1b62c7adee7f8f2bd58aa290afd6.tar.gz
        sha256: a6b1d55338ea12adc0177eaafd9521ac0101b6a8716c71024a668f4896fd6b7c
        dest: vendor/libdatachannel/deps/libjuice
      - type: archive
        url: https://github.com/nlohmann/json/archive/55f93686c01528224f448c19128836e7df245f72.tar.gz
        sha256: 67f4cdd9ca930c9c1e130af4a437c7fc98fab77a2846fc2d2a14b4943831f8ef
        dest: vendor/libdatachannel/deps/json
